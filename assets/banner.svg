<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bladeGrad" x1="90" y1="245" x2="1110" y2="45" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#0d0000" stop-opacity="0"/>
<stop offset="30%" stop-color="#4d0000"/>
<stop offset="65%" stop-color="#c40000"/>
<stop offset="100%" stop-color="#ff2b2b"/>
</linearGradient>
<linearGradient id="thinGrad" x1="150" y1="80" x2="1050" y2="255" gradientUnits="userSpaceOnUse">
<stop offset="0%" stop-color="#8b0000" stop-opacity="0"/>
<stop offset="50%" stop-color="#8b0000" stop-opacity="0.7"/>
<stop offset="100%" stop-color="#8b0000" stop-opacity="0"/>
</linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
<feGaussianBlur stdDeviation="5" result="b1"/>
<feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="softBlur">
<feGaussianBlur stdDeviation="9"/>
</filter>
</defs>

<rect width="1200" height="300" rx="16" fill="#050202" stroke="#4d0000" stroke-width="2"/>

<!-- huge Arabic watermark filling the background -->
<text x="600" y="215" text-anchor="middle" font-family="Tahoma, Segoe UI, Noto Naskh Arabic, Arial, sans-serif" font-size="280" font-weight="bold" fill="#3d0000" opacity="0.75">بتار</text>

<!-- corner brackets -->
<g stroke="#a30000" stroke-width="4" opacity="0.95" fill="none">
<path d="M 34 68 L 34 34 L 68 34"/>
<path d="M 1132 34 L 1166 34 L 1166 68"/>
<path d="M 34 232 L 34 266 L 68 266"/>
<path d="M 1132 266 L 1166 266 L 1166 232"/>
</g>

<!-- sword drag / slash -->
<line x1="90" y1="245" x2="1110" y2="45" stroke="url(#bladeGrad)" stroke-width="9" stroke-linecap="round" filter="url(#glow)"/>
<line x1="150" y1="80" x2="1050" y2="255" stroke="url(#thinGrad)" stroke-width="3" stroke-linecap="round"/>

<!-- spark at the blade crossing -->
<g filter="url(#glow)">
<circle cx="560" cy="90" r="7" fill="#ff2b2b"/>
<circle cx="578" cy="74" r="4" fill="#c40000"/>
<circle cx="542" cy="78" r="4" fill="#ff2b2b"/>
<circle cx="570" cy="108" r="3" fill="#8b0000"/>
<circle cx="548" cy="102" r="3" fill="#ff2b2b"/>
</g>

<!-- English title, in front, with glow -->
<text x="600" y="155" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="86" font-weight="bold" fill="#5c0000" filter="url(#softBlur)" opacity="0.9">BATTAR</text>
<text x="600" y="155" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="86" font-weight="bold" fill="#c40000" filter="url(#glow)">BATTAR</text>

<!-- subtitle -->
<text x="600" y="243" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="19" letter-spacing="5" fill="#7a1010">RED-CORE TOOLKIT</text>

<!-- tagline -->
<text x="600" y="270" text-anchor="middle" font-family="DejaVu Sans Mono, Courier New, monospace" font-size="13" fill="#5c1010">"the blade that doesn't just point at the target -- it cuts"</text>
</svg>
